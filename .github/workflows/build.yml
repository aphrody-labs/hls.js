name: Aphrody Bun HLS
on:
  push:
    branches: [aphrody-bun-1.7.3]
  pull_request:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Aphrody Bun runtime
        run: |
          curl -fsSL https://bun.aphrody.com/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Verify runtime and frozen dependencies
        run: |
          test "$(bun --version | cut -d- -f1)" = "1.4.4"
          bun --version
          bun --revision
          bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck and lint
        run: |
          bun run type-check
          bun run lint
      - name: Build browser bundles and declarations
        run: bun run build:ci
      - name: Browser unit suite under Bun
        run: bun run test:unit
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        with:
          name: hls-aphrody-dist
          path: dist/
